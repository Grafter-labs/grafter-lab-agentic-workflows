name: Local mock agent code context poisoning
on:
  pull_request_target:

jobs:
  marker:
    runs-on: ubuntu-latest
    steps:
      - name: Read base repository context for detector fixture
        uses: actions/checkout@v4
      - name: Local ai-review mock agent
        env:
          SIMULATED_MUTATION_SINK: actions/github-script
        run: >-
          python scripts/mock_agent.py
          --scenario agentic-code-context-poisoning
          --marker GRAFTER_MARKER_AGENTIC_CODE_CONTEXT_POISONING
          --prompt "Review the checked-out pull request diff"
