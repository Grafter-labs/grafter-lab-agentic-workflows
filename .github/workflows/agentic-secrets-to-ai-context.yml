name: Inert agent secret context fixture
on:
  pull_request_target:

permissions:
  contents: write

jobs:
  fixture:
    if: ${{ false }}
    runs-on: ubuntu-latest
    env:
      SIMULATED_MUTATION_SINK: actions/github-script
    steps:
      - uses: actions/checkout@v4
      - name: Local ai-review mock agent with placeholder secret context
        env:
          FIXTURE_SECRET: ${{ secrets.GRAFTER_FIXTURE_SECRET }}
        run: >-
          python scripts/mock_agent.py
          --scenario agentic-secrets-to-ai-context
          --prompt "${{ github.event.pull_request.body }}"

