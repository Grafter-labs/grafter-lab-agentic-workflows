name: Local mock agent workflow run poisoning
on:
  workflow_run:
    workflows: ["Untrusted agent fixture input"]
    types: [completed]

jobs:
  marker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Local ai-review mock agent for upstream metadata
        env:
          SIMULATED_MUTATION_SINK: actions/github-script
        run: >-
          python scripts/mock_agent.py
          --scenario agentic-workflow-run-poisoning
          --marker GRAFTER_MARKER_AGENTIC_WORKFLOW_RUN_POISONING
          --prompt "${{ github.event.workflow_run.display_title }}"
