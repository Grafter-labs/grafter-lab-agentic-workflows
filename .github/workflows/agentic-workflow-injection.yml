name: Local mock agent workflow injection
on:
  pull_request_target:

jobs:
  marker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Local ai-review mock agent
        env:
          SIMULATED_MUTATION_SINK: actions/github-script
        run: >-
          python scripts/mock_agent.py
          --scenario agentic-workflow-injection
          --marker GRAFTER_MARKER_AGENTIC_WORKFLOW_INJECTION
          --prompt "${{ github.event.pull_request.body }}"
